<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entreprises - HecRecruit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        nav { background: #2c3e50; color: white; padding: 1rem; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin: 0 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: #2c3e50; margin: 2rem 0; }
        .entreprises-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        .entreprise-card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .entreprise-card h3 { color: #2c3e50; margin-bottom: 0.5rem; }
        .entreprise-card .secteur { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 1rem; }
        .entreprise-card .info { color: #555; line-height: 1.5; margin: 0.5rem 0; }
        .btn { display: inline-block; padding: 0.6rem 1.2rem; background: #3498db; color: white; text-decoration: none; border-radius: 4px; margin-top: 1rem; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <nav>
        <div><strong>HecRecruit</strong></div>
        <div>
            <a href="/api/">Accueil</a>
            <a href="/api/offres">Offres</a>
            <a href="/api/candidats">Candidats</a>
            <a href="/api/entreprises">Entreprises</a>
        </div>
    </nav>

    <div class="container">
        <h1>Nos Entreprises Partenaires</h1>
        
        <div class="entreprises-grid" th:if="${!entreprises.isEmpty()}">
            <div class="entreprise-card" th:each="entreprise : ${entreprises}">
                <h3 th:text="${entreprise.nom}">Nom</h3>
                <div class="secteur" th:text="${entreprise.secteur != null ? entreprise.secteur : 'Non spécifié'}">Secteur</div>
                <div class="info"><strong>Email:</strong> <span th:text="${entreprise.email}">email@example.com</span></div>
                <div class="info"><strong>Téléphone:</strong> <span th:text="${entreprise.telephone}">+216 XX XXX XXX</span></div>
                <div class="info"><strong>Offres:</strong> <span th:text="${entreprise.offresPubliees.size()}">0</span></div>
                <a th:href="@{/api/entreprises/{id}(id=${entreprise.id})}" class="btn">Voir détails</a>
            </div>
        </div>
        <p th:if="${entreprises.isEmpty()}">Aucune entreprise trouvée.</p>
    </div>
</body>
</html>
