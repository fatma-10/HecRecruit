<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidats - HecRecruit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        nav { background: #2c3e50; color: white; padding: 1rem; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin: 0 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: #2c3e50; margin: 2rem 0; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #34495e; color: white; padding: 1rem; text-align: left; }
        td { padding: 1rem; border-bottom: 1px solid #ecf0f1; }
        tr:hover { background: #f8f9fa; }
        .btn { display: inline-block; padding: 0.5rem 1rem; background: #3498db; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <nav>
        <div><strong>HecRecruit</strong></div>
        <div>
            <a href="/api/">Accueil</a>
            <a href="/api/offres">Offres</a>
            <a href="/api/candidats">Candidats</a>
            <a href="/api/entreprises">Entreprises</a>
        </div>
    </nav>

    <div class="container">
        <h1>Liste des Candidats</h1>
        
        <table th:if="${!candidats.isEmpty()}">
            <thead>
                <tr>
                    <th>CIN</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Candidatures</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="candidat : ${candidats}">
                    <td th:text="${candidat.id}">CIN</td>
                    <td th:text="${candidat.nom}">Nom</td>
                    <td th:text="${candidat.prenom}">Prénom</td>
                    <td th:text="${candidat.email}">Email</td>
                    <td th:text="${candidat.telephone}">Téléphone</td>
                    <td th:text="${candidat.candidaturesEnCours.size()}">0</td>
                    <td><a th:href="@{/api/candidats/{id}(id=${candidat.id})}" class="btn">Voir</a></td>
                </tr>
            </tbody>
        </table>
        <p th:if="${candidats.isEmpty()}">Aucun candidat trouvé.</p>
    </div>
</body>
</html>
