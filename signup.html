<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Signup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="content-wrapper">
        <div class="signup-box">
          <div class="header">
            <h1>Create Account</h1>
            <p>Join us today and get started!</p>
          </div>
          <div class="form-container">
            <form id="signupForm">
              <div class="form-row">
                <div class="input-group">
                  <input type="text" id="firstName" required />
                  <label for="firstName">First Name</label>
                </div>
                <div class="input-group">
                  <input type="text" id="lastName" required />
                  <label for="lastName">Last Name</label>
                </div>
              </div>

              <div class="form-row">
                <div class="input-group">
                  <input type="email" id="email" required />
                  <label for="email">Email Address</label>
                </div>
                <div class="input-group">
                  <input type="tel" id="phone" required />
                  <label for="phone">Phone Number</label>
                </div>
              </div>

              <div class="form-row">
                <div class="input-group">
                  <input type="password" id="password" required />
                  <label for="password">Password</label>
                </div>
                <div class="input-group">
                  <input type="password" id="confirmPassword" required />
                  <label for="confirmPassword">Confirm Password</label>
                </div>
              </div>

              <div class="form-row">
                <div class="input-group full-width">
                  <input type="text" id="address" required />
                  <label for="address">Full Address</label>
                </div>
              </div>

              <div class="input-group full-width">
                <textarea id="bio" required></textarea>
                <label for="bio">Tell us about yourself</label>
              </div>

              <div class="checkbox-group">
                <input type="checkbox" id="terms" required />
                <label for="terms">I agree to the <a href="terms.html">Terms and Conditions</a></label>
              </div>

              <button type="submit">Create Account</button>
            </form>
            <div class="footer">
              <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
          </div>
        </div>
       <div id="map">
                            <iframe class="google-map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3988.819917806043!2d103.84793601429608!3d1.281807962148459!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31da190c2c94ccb3%3A0x11213560829baa05!2sTwitter!5e0!3m2!1sen!2smy!4v1669212183861!5m2!1sen!2smy" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                        </div>
      </div>
    </div>
    <script src="https://maps.google.com/maps/api/js?key=${import.meta.env.VITE_GOOGLE_MAPS_API_KEY}&libraries=places" defer></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
