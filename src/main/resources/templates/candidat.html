<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Candidat')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-candidat('dashboard')}"></header>

<main>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>Bonjour, <span th:text="${candidat.prenom} + ' ' + ${candidat.nom}"></span></h1>
                <p class="subtitle">Vue candidat — candidatures, offres et recommandations.</p>
            </div>
        </header>

        <section class="stat-grid">
            <article class="stat-card">
                <p class="label">Candidatures</p>
                <p class="value" th:text="${nbCandidatures}">0</p>
            </article>
            <article class="stat-card">
                <p class="label">Offres disponibles</p>
                <p class="value" th:text="${nbOffresDisponibles}">0</p>
            </article>
        </section>

        <header class="page-header">
            <div><h2>Dernières offres</h2></div>
        </header>
        <div class="offre-grid" th:if="${dernieresOffres != null && !dernieresOffres.isEmpty()}">
            <article class="offre-card" th:each="offre : ${dernieresOffres}">
                <h3 th:text="${offre.titre}"></h3>
                <p class="company" th:text="${offre.entreprise.nom}"></p>
            </article>
        </div>

        <header class="page-header" style="margin-top:2rem;">
            <div><h2>Recommandations</h2></div>
            <a href="/recommandations" class="btn btn-ghost">Détails</a>
        </header>
        <div class="offre-grid" th:if="${recommandations != null && !recommandations.isEmpty()}">
            <article class="offre-card" th:each="rec : ${recommandations}">
                <span class="score" th:text="${rec.scoreFormate}"></span>
                <h3 th:text="${rec.offre.titre}"></h3>
                <form method="post" th:action="'/candidat/offres/postuler/' + ${rec.offre.id}">
                    <button type="submit" class="btn btn-primary btn-sm">Postuler</button>
                </form>
            </article>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
