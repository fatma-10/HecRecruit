<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recommandations')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-candidat('recommandations')}"></header>

<main>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>Recommandations</h1>
                <p class="subtitle">
                    Pour <span th:text="${candidat.prenom} + ' ' + ${candidat.nom}"></span>
                    — offres les mieux adaptées à votre profil.
                </p>
            </div>
        </header>

        <div class="empty" th:if="${recommandations.empty}">
            <span class="icon">?</span>
            <h3>Aucune recommandation</h3>
            <p>Complétez votre profil et vos compétences pour améliorer le matching.</p>
            <a href="/candidat/profil" class="btn btn-primary">Mon profil</a>
        </div>

        <div class="offre-grid" th:if="${!recommandations.empty}">
            <article class="offre-card" th:each="rec : ${recommandations}">
                <span class="type-badge" th:text="${rec.offre.typeOffre}"></span>
                <h3 th:text="${rec.offre.titre}"></h3>
                <p class="company" th:text="${rec.offre.entreprise.nom}"></p>
                <p class="desc" th:text="${rec.offre.description}"></p>
                <div class="meta">
                    <span>Score</span>
                    <span class="score" th:text="${rec.scoreFormate}"></span>
                </div>
                <form method="post" th:action="'/candidat/offres/postuler/' + ${rec.offre.id}" style="margin-top:1rem;">
                    <button type="submit" class="btn btn-primary btn-sm">Postuler</button>
                </form>
            </article>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
