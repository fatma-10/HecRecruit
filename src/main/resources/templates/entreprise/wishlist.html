<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Wishlist')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-entreprise('wishlist')}"></header>

<main>
    <div class="container">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <header class="page-header">
            <div>
                <h1>Wishlist</h1>
                <p class="subtitle">Candidats sauvegardés — score basé sur leur meilleure candidature.</p>
            </div>
        </header>

        <div class="offre-grid" th:if="${wishlist != null && !wishlist.isEmpty()}">
            <article class="offre-card" th:each="candidat : ${wishlist}">
                <span class="score" th:text="${scoresCompatibilite[candidat.id]} + '%'"></span>
                <span class="type-badge" th:text="${candidat instanceof T(com.IHEC.Recruit.model.Etudiant)} ? 'Étudiant' : 'Alumni'"></span>
                <h3 th:text="${candidat.prenom} + ' ' + ${candidat.nom}"></h3>
                <p class="desc" th:text="${candidat.skills}"></p>
                <p class="company" th:text="${candidat.email} + ' · ' + ${candidat.telephone}"></p>
                <form method="post" th:action="'/entreprise/wishlist/retirer/' + ${candidat.id}" style="margin-top:1rem;">
                    <button type="submit" class="btn btn-danger btn-sm">Retirer</button>
                </form>
            </article>
        </div>

        <div class="empty" th:if="${wishlist == null || wishlist.isEmpty()}">
            <span class="icon">♡</span>
            <h3>Wishlist vide</h3>
            <p>Ajoutez des candidats depuis vos offres.</p>
            <a href="/entreprise/offres" class="btn btn-primary">Mes offres</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
