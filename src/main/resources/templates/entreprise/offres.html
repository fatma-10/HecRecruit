<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mes offres')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-entreprise('offres')}"></header>

<main>
    <div class="container">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <header class="page-header">
            <div>
                <h1>Mes offres</h1>
                <p class="subtitle">Publiez et gérez vos opportunités IHEC.</p>
            </div>
            <a href="/entreprise/offres/creer" class="btn btn-primary">Créer une offre</a>
        </header>

        <div class="offre-grid" th:if="${offres != null && !offres.isEmpty()}">
            <article class="offre-card" th:each="offre : ${offres}">
                <span class="type-badge" th:text="${offre.typeOffre}"></span>
                <h3 th:text="${offre.titre}"></h3>
                <p class="desc" th:text="${offre.description}"></p>
                <div class="meta">
                    <span th:if="${offre.dateExpiration != null}" th:text="'Expire : ' + ${offre.dateExpiration}"></span>
                </div>
                <div class="form-actions" style="margin-top:1rem;">
                    <a th:href="'/entreprise/offres/' + ${offre.id} + '/candidats'" class="btn btn-primary btn-sm">Candidats</a>
                    <form method="post" th:action="'/entreprise/offres/supprimer/' + ${offre.id}">
                        <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                    </form>
                </div>
            </article>
        </div>

        <div class="empty" th:if="${offres == null || offres.isEmpty()}">
            <span class="icon">+</span>
            <h3>Aucune offre</h3>
            <p>Publiez votre première opportunité pour les étudiants IHEC.</p>
            <a href="/entreprise/offres/creer" class="btn btn-primary">Créer une offre</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
