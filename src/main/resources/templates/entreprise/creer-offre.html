<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Créer une offre')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-entreprise('offres')}"></header>

<main>
    <div class="container">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <header class="page-header">
            <div>
                <h1>Nouvelle offre</h1>
                <p class="subtitle">Rédigez une offre claire pour améliorer le matching avec les candidats.</p>
            </div>
        </header>

        <form method="post" action="/entreprise/offres/creer" class="form-card">
            <div class="form-group">
                <label for="titre">Titre</label>
                <input type="text" id="titre" name="titre" placeholder="Ex : Stage Spring Boot" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          placeholder="Missions, environnement, profil attendu..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="type">Type d'offre</label>
                    <select id="type" name="type" required>
                        <option value="stage">Stage</option>
                        <option value="alternance">Alternance</option>
                        <option value="projet fin d'etudes">Projet Fin d'Études</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dateExpiration">Date d'expiration</label>
                    <input type="date" id="dateExpiration" name="dateExpiration">
                    <p class="form-help">Laisser vide pour une offre sans date limite.</p>
                </div>
            </div>

            <div id="panel-stage">
                <h3 style="margin:1.5rem 0 1rem;">Détails stage</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="domaine">Domaine</label>
                        <input type="text" id="domaine" name="domaine" placeholder="Développement web">
                    </div>
                    <div class="form-group">
                        <label for="dureeStage">Durée (mois)</label>
                        <input type="number" id="dureeStage" name="dureeStage" min="1">
                    </div>
                </div>
            </div>

            <div id="panel-alternance" class="hidden">
                <h3 style="margin:1.5rem 0 1rem;">Détails alternance</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="rythme">Rythme</label>
                        <input type="text" id="rythme" name="rythme" placeholder="3j entreprise / 2j école">
                    </div>
                    <div class="form-group">
                        <label for="dureeAlternance">Durée (mois)</label>
                        <input type="number" id="dureeAlternance" name="dureeAlternance" min="1">
                    </div>
                </div>
            </div>

            <div id="panel-pfe" class="hidden">
                <h3 style="margin:1.5rem 0 1rem;">Détails PFE</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sujet">Sujet</label>
                        <input type="text" id="sujet" name="sujet">
                    </div>
                    <div class="form-group">
                        <label for="technologies">Technologies</label>
                        <input type="text" id="technologies" name="technologies" placeholder="Spring Boot, MySQL...">
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Publier</button>
                <a href="/entreprise/offres" class="btn btn-ghost">Annuler</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    var typeSelect = document.getElementById('type');
    var panels = {
        'stage': document.getElementById('panel-stage'),
        'alternance': document.getElementById('panel-alternance'),
        "projet fin d'etudes": document.getElementById('panel-pfe')
    };

    function switchPanel(value) {
        Object.keys(panels).forEach(function(key) {
            if (panels[key]) {
                panels[key].classList.toggle('hidden', key !== value);
            }
        });
    }

    typeSelect.addEventListener('change', function() {
        switchPanel(typeSelect.value);
    });
    switchPanel(typeSelect.value);
</script>
</body>
</html>
