<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Candidats')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-entreprise('offres')}"></header>

<main>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>Candidats — <span th:text="${offre.titre}"></span></h1>
                <p class="subtitle">Évaluez les profils par score de compatibilité.</p>
            </div>
            <a href="/entreprise/offres" class="btn btn-ghost">Retour aux offres</a>
        </header>

        <div class="offre-grid" th:if="${candidatures != null && !candidatures.isEmpty()}">
            <article class="offre-card" th:each="candidature : ${candidatures}" th:with="candidat=${candidature.candidat}">
                <span class="score" th:text="${scoresCompatibilite[candidat.id]} + '%'"></span>
                <span class="type-badge" th:text="${candidat instanceof T(com.IHEC.Recruit.model.Etudiant)} ? 'Étudiant' : 'Alumni'"></span>
                <span class="badge badge-warning" th:if="${candidature.pending}">En attente</span>
                <span class="badge badge-success" th:if="${candidature.contacted}">Contacté</span>
                <span class="badge badge-warning" th:if="${candidature.refused}">Refusé</span>
                <h3 th:text="${candidat.prenom} + ' ' + ${candidat.nom}"></h3>
                <p class="desc" th:text="${candidat.skills}"></p>
                <p class="company" th:text="${candidat.email} + ' · ' + ${candidat.telephone}"></p>
                <div class="form-actions" style="margin-top:1rem; flex-wrap:wrap;">
                    <form method="post" th:action="'/entreprise/offres/' + ${offre.id} + '/candidats/wishlist/' + ${candidat.id}">
                        <button type="submit" class="btn btn-primary btn-sm">Wishlist</button>
                    </form>
                    <form method="post" th:action="'/entreprise/offres/' + ${offre.id} + '/candidats/contacte/' + ${candidat.id}">
                        <button type="submit" class="btn btn-ghost btn-sm">Contacté</button>
                    </form>
                    <form method="post" th:action="'/entreprise/offres/' + ${offre.id} + '/candidats/refuser/' + ${candidat.id}">
                        <button type="submit" class="btn btn-danger btn-sm">Refuser</button>
                    </form>
                    <form method="post" th:action="'/entreprise/offres/' + ${offre.id} + '/candidats/attente/' + ${candidat.id}">
                        <button type="submit" class="btn btn-ghost btn-sm">En attente</button>
                    </form>
                </div>
            </article>
        </div>

        <div class="empty" th:if="${candidatures == null || candidatures.isEmpty()}">
            <span class="icon">0</span>
            <h3>Aucun candidat</h3>
            <p>Aucune candidature pour cette offre pour le moment.</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
