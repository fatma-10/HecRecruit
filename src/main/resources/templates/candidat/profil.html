<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mon profil')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-candidat('profil')}"></header>

<main>
    <div class="container">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <header class="page-header">
            <div>
                <h1 th:text="${candidat.prenom} + ' ' + ${candidat.nom}">Profil</h1>
                <p class="subtitle">Gardez vos compétences à jour pour améliorer le matching.</p>
            </div>
            <span class="badge badge-score" th:if="${candidat instanceof T(com.IHEC.Recruit.model.Etudiant)}">Étudiant IHEC</span>
            <span class="badge badge-warning" th:if="${candidat instanceof T(com.IHEC.Recruit.model.Alumni)}">Alumni</span>
        </header>

        <div class="grid two" style="margin-bottom:2rem;">
            <article class="form-card">
                <h3>Informations</h3>
                <p><strong>CIN :</strong> <span th:text="${candidat.id}"></span></p>
                <p><strong>Email :</strong> <span th:text="${candidat.email}"></span></p>
                <p><strong>Téléphone :</strong> <span th:text="${candidat.telephone}"></span></p>
            </article>
            <article class="form-card">
                <h3>Compétences actuelles</h3>
                <p th:text="${candidat.skills}"></p>
            </article>
        </div>

        <form method="post" action="/candidat/profil/modifier" class="form-card">
            <h2>Modifier le profil</h2>
            <p class="form-help" style="margin-bottom:1.5rem;">Mots-clés courts, séparés par des virgules ou espaces.</p>

            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" th:value="${candidat.telephone}" required>
            </div>

            <div class="form-group">
                <label for="skills">Compétences</label>
                <textarea id="skills" name="skills" required
                          placeholder="Java, Spring Boot, SQL..."
                          th:text="${candidat.skills}"></textarea>
            </div>

            <th:block th:if="${candidat instanceof T(com.IHEC.Recruit.model.Etudiant)}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="niveau">Niveau</label>
                        <input type="text" id="niveau" name="niveau" list="niveaux-list"
                               th:value="${candidat.niveau}" placeholder="Ex : Niveau 2, Master..." required>
                    </div>
                    <div class="form-group">
                        <label for="filiere">Filière</label>
                        <input type="text" id="filiere" name="filiere" list="filieres-list"
                               th:value="${candidat.filiere}" placeholder="Ex : BI, Comptabilité gestion..." required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="etablissement">Établissement</label>
                    <input type="text" id="etablissement" name="etablissement" th:value="${candidat.etablissement}" required>
                </div>
            </th:block>

            <th:block th:if="${candidat instanceof T(com.IHEC.Recruit.model.Alumni)}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="posteActuel">Poste actuel</label>
                        <input type="text" id="posteActuel" name="posteActuel" th:value="${candidat.posteActuel}">
                    </div>
                    <div class="form-group">
                        <label for="entrepriseActuelle">Entreprise actuelle</label>
                        <input type="text" id="entrepriseActuelle" name="entrepriseActuelle" th:value="${candidat.entrepriseActuelle}">
                    </div>
                </div>
            </th:block>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="/candidat/dashboard" class="btn btn-ghost">Annuler</a>
            </div>
        </form>
    </div>
</main>

<th:block th:replace="~{fragments/suggestions :: filieres}"></th:block>
<th:block th:replace="~{fragments/suggestions :: niveaux}"></th:block>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
