<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Offres')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-candidat('offres')}"></header>

<main>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>Offres disponibles</h1>
                <p class="subtitle">Comparez les opportunités selon votre score de compatibilité.</p>
            </div>
        </header>

        <form method="get" class="filter-bar">
            <div class="form-group">
                <label for="critere">Rechercher par</label>
                <select id="critere" name="critere">
                    <option value="titre" th:selected="${critere == 'titre'}">Titre</option>
                    <option value="type" th:selected="${critere == 'type'}">Type</option>
                    <option value="domaine" th:selected="${critere == 'stage'}">Stage</option>
                    <option value="rythme" th:selected="${critere == 'alternance'}">Alternance</option>
                    <option value="technologies" th:selected="${critere == 'technologies'}">Technologies PFE</option>
                </select>
            </div>
            <div class="form-group">
                <label for="valeur">Mot-clé</label>
                <input id="valeur" type="text" name="valeur" th:value="${valeur}" placeholder="Spring Boot, SQL...">
            </div>
            <button type="submit" class="btn btn-primary">Filtrer</button>
            <a href="/candidat/offres" class="btn btn-ghost">Réinitialiser</a>
        </form>

        <div class="offre-grid" th:if="${offres != null && !offres.isEmpty()}">
            <article class="offre-card" th:each="offre : ${offres}">
                <span class="type-badge" th:text="${offre.typeOffre}"></span>
                <h3 th:text="${offre.titre}"></h3>
                <p class="company" th:text="${offre.entreprise.nom}"></p>
                <p class="desc" th:text="${offre.description}"></p>
                <div class="meta">
                    <span th:if="${offre.dateExpiration != null}" th:text="'Expire : ' + ${offre.dateExpiration}"></span>
                    <span class="score" th:text="${scoresCompatibilite[offre.id]} + '%'"></span>
                </div>
                <div class="form-actions" style="margin-top:1rem;">
                    <form method="post" th:action="'/candidat/offres/postuler/' + ${offre.id}">
                        <button type="submit" class="btn btn-primary btn-sm">Postuler</button>
                    </form>
                    <a th:href="'/candidat/offres/' + ${offre.id}" class="btn btn-ghost btn-sm">Détails</a>
                </div>
            </article>
        </div>

        <div class="empty" th:if="${offres == null || offres.isEmpty()}">
            <span class="icon">0</span>
            <h3>Aucune offre</h3>
            <p>Aucune offre ne correspond à ce filtre.</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
