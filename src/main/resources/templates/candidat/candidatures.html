<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes candidatures</title>
</head>
<body>
<h1>Mes candidatures</h1>
<div th:each="offre : ${candidatures}">
    <div>
        <strong th:text="${offre.titre}"></strong> - <span th:text="${offre.entreprise.nom}"></span>
        <form method="post" th:action="'/candidat/candidatures/retirer/' + ${offre.id}" style="display:inline;">
            <button type="submit">Retirer</button>
        </form>
    </div>
</div>
<a href="/candidat/dashboard">← Retour</a>
</body>
</html>
