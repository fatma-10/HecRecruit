<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mes candidatures')}"></head>
<body>
<header th:replace="~{fragments/layout :: header-candidat('candidatures')}"></header>

<main>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>Mes candidatures</h1>
                <p class="subtitle">Suivez vos postulations et retirez-les si besoin.</p>
            </div>
        </header>

        <div class="offre-grid" th:if="${candidatures != null && !candidatures.isEmpty()}">
            <article class="offre-card" th:each="candidature : ${candidatures}">
                <span class="type-badge" th:text="${candidature.offre.typeOffre}"></span>
                <span class="badge badge-warning" th:if="${candidature.pending}">En attente</span>
                <span class="badge badge-success" th:if="${candidature.contacted}">Contacté</span>
                <span class="badge badge-warning" th:if="${candidature.refused}">Refusé</span>
                <h3 th:text="${candidature.offre.titre}"></h3>
                <p class="company" th:text="${candidature.offre.entreprise.nom}"></p>
                <p class="desc" th:text="${candidature.offre.description}"></p>
                <form method="post" th:action="'/candidat/candidatures/retirer/' + ${candidature.offre.id}" style="margin-top:1rem;">
                    <button type="submit" class="btn btn-danger btn-sm">Retirer</button>
                </form>
            </article>
        </div>

        <div class="empty" th:if="${candidatures == null || candidatures.isEmpty()}">
            <span class="icon">—</span>
            <h3>Aucune candidature</h3>
            <p>Vous n'avez pas encore postulé à une offre.</p>
            <a href="/candidat/offres" class="btn btn-primary">Voir les offres</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
