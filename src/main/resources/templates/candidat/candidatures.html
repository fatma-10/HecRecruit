<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mes candidatures - HecRecruit</title>
    <link rel="stylesheet" href="/css/hec-ui.css">
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a href="/candidat/dashboard" class="brand">
            <strong>HecRecruit</strong>
            <span>Applications</span>
        </a>
        <nav class="nav-actions">
            <a href="/candidat/dashboard" class="btn btn-secondary">Dashboard</a>
            <a href="/candidat/offres" class="btn btn-secondary">Offers</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </nav>
    </header>

    <section class="page-title">
        <div>
            <h1>My applications</h1>
            <p>Track the opportunities you applied to and withdraw when needed.</p>
        </div>
    </section>

    <section class="grid" th:if="${candidatures != null && !candidatures.isEmpty()}">
        <article class="card offer-card" th:each="offre : ${candidatures}">
            <span class="badge badge-score" th:text="${offre.typeOffre}"></span>
            <h3 th:text="${offre.titre}"></h3>
            <p class="description-preview" th:text="${offre.description}"></p>
            <div class="offer-meta">
                <strong th:text="${offre.entreprise.nom}"></strong>
            </div>
            <form method="post" th:action="'/candidat/candidatures/retirer/' + ${offre.id}">
                <button type="submit" class="btn btn-danger">Withdraw</button>
            </form>
        </article>
    </section>

    <div class="empty-state" th:if="${candidatures == null || candidatures.isEmpty()}">
        You have not applied to any offer yet.
    </div>
</main>
</body>
</html>
