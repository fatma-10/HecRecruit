<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:temporals="http://www.thymeleaf.org/extras/java-time">
<head th:replace="~{fragments/layout :: head('Forum')}"></head>
<body>
<header th:replace="${userType == 'entreprise'} ? ~{fragments/layout :: header-entreprise('forum')} : ~{fragments/layout :: header-candidat('forum')}"></header>

<main>
    <div class="container">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <header class="page-header">
            <div>
                <h1>Forum</h1>
                <p class="subtitle">Échanges entre étudiants, alumni et entreprises.</p>
            </div>
        </header>

        <form method="get" action="/forum/recherche" class="filter-bar">
            <div class="form-group">
                <label for="critereSelect">Rechercher par</label>
                <select name="critere" id="critereSelect" onchange="toggleValeur()">
                    <option value="auteur" th:selected="${critere == 'auteur'}">Auteur</option>
                    <option value="message" th:selected="${critere == 'message'}">Contenu</option>
                    <option value="etudiant" th:selected="${critere == 'etudiant'}">Posts étudiants</option>
                    <option value="entreprise" th:selected="${critere == 'entreprise'}">Posts entreprises</option>
                </select>
            </div>
            <div class="form-group">
                <label for="valeurInput">Mot-clé</label>
                <input type="text" name="valeur" id="valeurInput" th:value="${valeur}" placeholder="Rechercher...">
            </div>
            <button type="submit" class="btn btn-primary">Filtrer</button>
            <a href="/forum" class="btn btn-ghost">Réinitialiser</a>
        </form>

        <div class="empty" th:if="${messages == null or messages.empty}">
            <span class="icon">—</span>
            <h3>Aucun message</h3>
            <p>Soyez le premier à lancer la discussion.</p>
        </div>

        <div th:if="${messages != null and !messages.empty}">
            <article class="forum-message"
                     th:each="msg : ${messages}"
                     th:classappend="${msg.estEtudiant} ? ' etudiant' : ' entreprise'">
                <div class="meta">
                    <span>
                        <em class="auteur" th:text="${msg.auteur}"></em>
                        <span class="role" th:text="${msg.estEtudiant} ? 'Étudiant' : 'Entreprise'"></span>
                    </span>
                    <span class="date" th:text="${#temporals.format(msg.datePublication, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <p class="body" th:text="${msg.message}"></p>
            </article>
        </div>

        <section class="forum-compose" style="margin-top:2rem;">
            <h3>Publier un message</h3>
            <p class="form-help">
                En tant que <strong th:text="${userNom}"></strong>
                (<span th:text="${userEmail}"></span>)
            </p>
            <form method="post" action="/forum/poster">
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Partagez une question ou une actualité..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Publier</button>
            </form>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    function toggleValeur() {
        var critere = document.getElementById('critereSelect').value;
        var valeurInput = document.getElementById('valeurInput');
        var sansValeur = (critere === 'etudiant' || critere === 'entreprise');
        valeurInput.closest('.form-group').style.display = sansValeur ? 'none' : '';
        if (sansValeur) {
            valeurInput.removeAttribute('required');
            valeurInput.value = '';
        } else {
            valeurInput.setAttribute('required', 'required');
        }
    }
    document.addEventListener('DOMContentLoaded', toggleValeur);
</script>
</body>
</html>
