<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forum')}"></head>
<body>
<header th:replace="${userType == 'entreprise'} ? ~{fragments/layout :: header-entreprise('forum')} : ~{fragments/layout :: header-candidat('forum')}"></header>

<main>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>Forum</h1>
                <p class="subtitle">Recherche et publication de messages.</p>
            </div>
        </header>

        <form method="get" action="/forum/recherche" class="filter-bar">
            <div class="form-group">
                <label for="legacyCritere">Rechercher par</label>
                <select id="legacyCritere" name="critere">
                    <option value="auteur">Auteur</option>
                    <option value="message">Contenu</option>
                    <option value="etudiant">Posts étudiants</option>
                    <option value="entreprise">Posts entreprises</option>
                </select>
            </div>
            <div class="form-group">
                <label for="legacyValeur">Mot-clé</label>
                <input id="legacyValeur" type="text" name="valeur" placeholder="Rechercher...">
            </div>
            <button type="submit" class="btn btn-primary">Filtrer</button>
        </form>

        <div th:if="${messages != null}">
            <article class="forum-message etudiant" th:each="msg : ${messages}"
                     th:classappend="${msg.estEtudiant} ? ' etudiant' : ' entreprise'">
                <div class="meta">
                    <span><em class="auteur" th:text="${msg.auteur}"></em>
                        <span class="role" th:text="${msg.estEtudiant} ? 'Étudiant' : 'Entreprise'"></span>
                    </span>
                    <span class="date" th:text="${msg.datePublication}"></span>
                </div>
                <p class="body" th:text="${msg.message}"></p>
            </article>
        </div>

        <section class="forum-compose">
            <h3>Nouveau message</h3>
            <form method="post" action="/forum/poster">
                <div class="form-group">
                    <label for="legacyMessage">Message</label>
                    <textarea id="legacyMessage" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Publier</button>
            </form>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
