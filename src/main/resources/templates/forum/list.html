<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forum - HecRecruit</title>
    <style>
        .message { border-bottom: 1px solid #ccc; margin-bottom: 10px; padding: 5px; }
        .author { font-weight: bold; }
        .date { font-size: 0.8em; color: gray; }
    </style>
</head>
<body>
<h1>Forum de discussion</h1>

<!-- Formulaire de recherche -->
<form method="get" action="/forum/recherche">
    <select name="critere">
        <option value="auteur">Auteur</option>
        <option value="message">Contenu</option>
        <option value="etudiant">Messages étudiants</option>
        <option value="entreprise">Messages entreprises</option>
    </select>
    <input type="text" name="valeur" placeholder="Rechercher..." />
    <button type="submit">Filtrer</button>
</form>

<!-- Liste des messages -->
<div th:each="msg : ${messages}">
    <div class="message">
        <div class="author">
            <span th:text="${msg.auteur}"></span>
            (<span th:text="${msg.estEtudiant} ? 'Étudiant' : 'Entreprise'"></span>)
        </div>
        <div class="date" th:text="${msg.datePublication}"></div>
        <p th:text="${msg.message}"></p>
    </div>
</div>

<hr/>

<!-- Formulaire de publication -->
<!-- auteur et email sont lus depuis la session côté controller ;
     seul le contenu du message est envoyé par le formulaire. -->
<h3>Poster un nouveau message</h3>
<form method="post" action="/forum/poster">
    <textarea name="message" rows="4" cols="50"
              placeholder="Votre message..." required></textarea><br/>
    <button type="submit">Publier</button>
</form>

<!-- Navigation conditionnelle selon le type d'utilisateur connecté -->
<p>
    <span th:if="${userType == 'candidat'}">
        <a href="/candidat/dashboard">Retour au tableau de bord candidat</a>
    </span>
    <span th:if="${userType == 'entreprise'}">
        <a href="/entreprise/dashboard">Retour au tableau de bord entreprise</a>
    </span>
</p>
</body>
</html>
