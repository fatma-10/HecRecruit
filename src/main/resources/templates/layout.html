<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HecRecruit</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .nav { background: #2c3e50; padding: 10px; color: white; }
        .nav a { color: white; margin-right: 15px; text-decoration: none; }
        .success { color: green; }
        .error { color: red; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: white; }
        .btn { background: #3498db; color: white; padding: 5px 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="nav">
    <a href="/">Accueil</a>
    <a href="/forum">Forum</a>
    <a href="/recommandations">Recommandations</a>
    <a href="/logout">Déconnexion</a>
</div>
<div class="container">
    <div th:if="${success}" class="success" th:text="${success}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:replace="${view} :: content"></div>
</div>
</body>
</html>
