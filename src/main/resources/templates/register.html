<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription - HecRecruit</title>
    <style>
        body { font-family: Arial; margin: 50px; text-align: center; }
        .form { width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input, select, button { width: 100%; margin: 8px 0; padding: 8px; }
        .error { color: red; }
    </style>
</head>
<body>
<h1>Inscription <span th:text="${type == 'candidat' ? 'Candidat' : 'Entreprise'}"></span></h1>
<div class="form">
    <!-- Formulaire candidat -->
    <div th:if="${type == 'candidat'}">
        <form method="post" action="/register/candidat">
            <input type="text"     name="nom"       placeholder="Nom"                              required />
            <input type="text"     name="prenom"    placeholder="Prénom"                           required />
            <input type="email"    name="email"     placeholder="Email (doit finir par @ihec.ucar.tn)" required />
            <input type="tel"      name="telephone" placeholder="Téléphone"                        required />
            <input type="password" name="password"  placeholder="Mot de passe"                    required />
            <input type="text"     name="cin"       placeholder="CIN (8 chiffres)"                required />
            <input type="text"     name="skills"    placeholder="Competences"                     required />
            <select name="candidatType" id="candidatType" required onchange="toggleCandidatFields()">
                <option value="etudiant">Étudiant</option>
                <option value="alumni">Alumni</option>
            </select>

            <!--
                BUG 9 CORRIGÉ : les champs du bloc actif reçoivent l'attribut required
                via toggleCandidatFields(). Le bloc inactif a ses required retirés,
                ce qui évite toute erreur de validation HTML5 sur des champs masqués.
            -->

            <!-- Champs Étudiant -->
            <div id="etudiant-fields">
                <input type="text" name="niveau"        id="niveau"        placeholder="Niveau (ex: Licence 3)" />
                <input type="text" name="filiere"       id="filiere"       placeholder="Filière" />
                <input type="text" name="etablissement" id="etablissement" placeholder="Établissement" />
            </div>

            <!-- Champs Alumni -->
            <div id="alumni-fields" style="display:none;">
                <input type="text" name="anneeDiplome"       id="anneeDiplome"       placeholder="Année de diplôme" />
                <input type="text" name="posteActuel"        id="posteActuel"        placeholder="Poste actuel" />
                <input type="text" name="entrepriseActuelle" id="entrepriseActuelle" placeholder="Entreprise actuelle" />
            </div>

            <button type="submit">S'inscrire</button>
            <div th:if="${error}" class="error" th:text="${error}"></div>
        </form>
    </div>

    <!-- Formulaire entreprise -->
    <div th:if="${type == 'entreprise'}">
        <form method="post" action="/register/entreprise">
            <input type="text"     name="nom"       placeholder="Nom de l'entreprise" required />
            <input type="text"     name="secteur"   placeholder="Secteur d'activité" />
            <input type="text"     name="adresse"   placeholder="Adresse" />
            <input type="email"    name="email"     placeholder="Email"               required />
            <input type="tel"      name="telephone" placeholder="Téléphone"           required />
            <input type="password" name="password"  placeholder="Mot de passe"       required />
            <button type="submit">S'inscrire</button>
            <div th:if="${error}" class="error" th:text="${error}"></div>
        </form>
    </div>

    <a href="/">← Retour à l'accueil</a>
</div>

<script>
    /**
     * BUG 9 CORRIGÉ : gestion du required sur les champs conditionnels.
     *
     * Principe : un champ masqué avec required bloque la soumission du formulaire
     * en HTML5 même s'il est invisible. On retire donc required sur le bloc inactif
     * et on l'ajoute sur le bloc actif à chaque changement de type de candidat.
     */
    var etudiantInputIds = ['niveau', 'filiere', 'etablissement'];
    var alumniInputIds   = ['anneeDiplome', 'posteActuel', 'entrepriseActuelle'];

    function setRequired(ids, required) {
        ids.forEach(function(id) {
            var el = document.getElementById(id);
            if (!el) return;
            if (required) {
                el.setAttribute('required', 'required');
            } else {
                el.removeAttribute('required');
            }
        });
    }

    function toggleCandidatFields() {
        var select = document.getElementById('candidatType');
        if (!select) return; // formulaire entreprise : rien à faire

        var isEtudiant = select.value === 'etudiant';

        // Affichage des blocs
        document.getElementById('etudiant-fields').style.display = isEtudiant ? 'block' : 'none';
        document.getElementById('alumni-fields').style.display   = isEtudiant ? 'none'  : 'block';

        // BUG 9 — required uniquement sur le bloc visible
        setRequired(etudiantInputIds, isEtudiant);
        setRequired(alumniInputIds,   !isEtudiant);
    }

    // Initialisation au chargement : applique l'état correct dès l'affichage
    document.addEventListener('DOMContentLoaded', toggleCandidatFields);
</script>
</body>
</html>
