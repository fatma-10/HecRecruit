<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body class="page-auth page-register">
<header th:replace="~{fragments/layout :: header-public}"></header>

<div class="auth-wrap">
    <div class="auth-card auth-card--register">
        <aside class="auth-side auth-side--animated">
            <h2>Rejoignez HecRecruit</h2>
            <p>Accédez aux offres, au matching et au forum en quelques clics.</p>
            <a th:href="'/login?type=' + ${type}" class="btn">J'ai déjà un compte</a>
            <a href="/" class="btn btn-ghost-auth">Accueil</a>
        </aside>

        <div class="auth-form-side auth-form-side--compact">
            <div class="auth-form-head">
                <h2 th:text="${type == 'candidat'} ? 'Inscription candidat' : 'Inscription entreprise'">Inscription</h2>
                <p class="subtitle" th:text="${type == 'candidat'} ? 'Profil étudiant ou alumni IHEC' : 'Compte recruteur partenaire'"></p>
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <div th:if="${type == 'candidat'}">
                <form method="post" action="/register/candidat" class="auth-form-grid">
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input id="nom" type="text" name="nom" required>
                    </div>
                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input id="prenom" type="text" name="prenom" required>
                    </div>
                    <div class="form-group">
                        <label for="cin">CIN</label>
                        <input id="cin" type="text" name="cin" placeholder="8 chiffres" required>
                    </div>
                    <div class="form-group span-2">
                        <label for="email">Email IHEC</label>
                        <input id="email" type="email" name="email" placeholder="nom@ihec.ucar.tn" required>
                    </div>
                    <div class="form-group">
                        <label for="telephone">Tél.</label>
                        <input id="telephone" type="tel" name="telephone" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input id="password" type="password" name="password" required>
                    </div>
                    <div class="form-group span-2">
                        <label for="skills">Compétences</label>
                        <input id="skills" type="text" name="skills" placeholder="Java, SQL, Power BI..." required>
                    </div>
                    <div class="form-group">
                        <label for="candidatType">Profil</label>
                        <select name="candidatType" id="candidatType" required onchange="toggleCandidatFields()">
                            <option value="etudiant">Étudiant</option>
                            <option value="alumni">Alumni</option>
                        </select>
                    </div>

                    <div id="etudiant-fields" class="auth-panel-grid">
                        <div class="form-group">
                            <label for="niveau">Niveau</label>
                            <input type="text" name="niveau" id="niveau" list="niveaux-list"
                                   placeholder="Niveau 2, Master..." autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="filiere">Filière</label>
                            <input type="text" name="filiere" id="filiere" list="filieres-list"
                                   placeholder="BI, Comptabilité..." autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="etablissement">Établissement</label>
                            <input type="text" name="etablissement" id="etablissement" placeholder="IHEC">
                        </div>
                    </div>

                    <div id="alumni-fields" class="auth-panel-grid is-hidden">
                        <div class="form-group">
                            <label for="anneeDiplome">Année diplôme</label>
                            <input type="text" name="anneeDiplome" id="anneeDiplome">
                        </div>
                        <div class="form-group">
                            <label for="posteActuel">Poste</label>
                            <input type="text" name="posteActuel" id="posteActuel">
                        </div>
                        <div class="form-group">
                            <label for="entrepriseActuelle">Entreprise</label>
                            <input type="text" name="entrepriseActuelle" id="entrepriseActuelle">
                        </div>
                    </div>

                    <div class="form-actions span-3">
                        <button type="submit" class="btn btn-primary">Créer mon compte</button>
                    </div>
                </form>
            </div>

            <div th:if="${type == 'entreprise'}">
                <form method="post" action="/register/entreprise" class="auth-form-grid auth-form-grid--2">
                    <div class="form-group span-2">
                        <label for="entrepriseNom">Entreprise</label>
                        <input id="entrepriseNom" type="text" name="nom" required>
                    </div>
                    <div class="form-group">
                        <label for="secteur">Secteur</label>
                        <input id="secteur" type="text" name="secteur">
                    </div>
                    <div class="form-group">
                        <label for="adresse">Adresse</label>
                        <input id="adresse" type="text" name="adresse">
                    </div>
                    <div class="form-group">
                        <label for="entrepriseEmail">Email</label>
                        <input id="entrepriseEmail" type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="entrepriseTelephone">Téléphone</label>
                        <input id="entrepriseTelephone" type="tel" name="telephone" required>
                    </div>
                    <div class="form-group span-2">
                        <label for="entreprisePassword">Mot de passe</label>
                        <input id="entreprisePassword" type="password" name="password" required>
                    </div>
                    <div class="form-actions span-2">
                        <button type="submit" class="btn btn-primary">Créer le compte entreprise</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/suggestions :: filieres}"></th:block>
<th:block th:replace="~{fragments/suggestions :: niveaux}"></th:block>

<script th:replace="~{fragments/layout :: auth-script}"></script>
</body>
</html>
