spring.application.name=Recruit

# ===== Database (MySQL par defaut) =====
spring.datasource.url=jdbc:mysql://localhost:3306/poo?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = cree les tables si manquantes, met a jour les colonnes - PAS de perte de donnees
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# open-in-view=true permet d'acceder aux collections lazy depuis les templates Thymeleaf
# (relation Candidat.candidaturesEnCours, Offre.candidatures, Entreprise.wishlist, ...).
# C'est le defaut Spring Boot - pratique pour ce projet mais a revoir pour une vraie prod.
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== Server =====
server.port=8081
server.error.include-message=always
server.servlet.session.timeout=30m

# ===== Multipart (pour eventuels uploads CV) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Logging =====
logging.level.com.IHEC.Recruit=INFO
logging.level.org.hibernate.SQL=DEBUG
