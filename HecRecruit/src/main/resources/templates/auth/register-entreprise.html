<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Inscription Entreprise</title>
</head>
<body>
<div layout:fragment="content">

    <div class="container-narrow" style="padding: 2rem 0;">
        <div class="form-card">
            <div class="form-header">
                <span class="eyebrow">Inscription</span>
                <h2>Créer un compte entreprise</h2>
            </div>

            <form th:action="@{/register/entreprise}" th:object="${registerForm}" method="post">

                <div class="form-group">
                    <label>Nom de l'entreprise</label>
                    <input type="text" th:field="*{nom}">
                    <div class="field-error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Secteur</label>
                        <input type="text" th:field="*{secteur}" placeholder="Tech, Finance, Conseil…">
                    </div>
                    <div class="form-group">
                        <label>Adresse</label>
                        <input type="text" th:field="*{adresse}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email professionnel</label>
                    <input type="email" th:field="*{email}">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="tel" th:field="*{telephone}">
                        <div class="field-error" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></div>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" th:field="*{mdp}">
                        <div class="field-error" th:if="${#fields.hasErrors('mdp')}" th:errors="*{mdp}"></div>
                    </div>
                </div>

                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

                <div class="form-actions">
                    <a th:href="@{/}" class="btn btn-ghost">Annuler</a>
                    <button type="submit" class="btn btn-primary">Créer mon compte</button>
                </div>

                <p style="text-align:center; margin-top: 2rem; font-size: 13px; color: var(--muted);">
                    Déjà inscrit ? <a th:href="@{/login/entreprise}">Se connecter</a>
                </p>
            </form>
        </div>
    </div>

</div>
</body>
</html>
